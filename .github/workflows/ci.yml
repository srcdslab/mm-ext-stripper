name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute version
        id: compute
        shell: bash
        run: |
          base_version=$(sed -e 's/[[:space:]]*$//' -e 's/-dev$//' product.version)
          build_number=$(git rev-list --count HEAD)
          echo "version=${base_version}-git${build_number}" >> "$GITHUB_OUTPUT"

  build:
    name: stripper-mms${{ matrix.mms.label }}-${{ matrix.target.os_name }}-${{ matrix.target.arch }}
    needs: version
    runs-on: ${{ matrix.target.os }}
    container: ${{ matrix.target.container }}
    strategy:
      fail-fast: false
      matrix:
        mms:
          - label: "1.12"
            branch: "1.12-dev"
          - label: "2.0"
            branch: "master"
        target:
          - os: ubuntu-latest
            os_name: linux
            arch: x86
            container: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest
          - os: ubuntu-latest
            os_name: linux
            arch: x86_64
            container: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest
          - os: windows-latest
            os_name: windows
            arch: x86
            msvc_arch: x86
          - os: windows-latest
            os_name: windows
            arch: x86_64
            msvc_arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python (Windows)
        if: matrix.target.os_name == 'windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup MSVC (Windows)
        if: matrix.target.os_name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target.msvc_arch }}

      - name: Install AMBuild
        if: matrix.target.os_name == 'windows'
        shell: bash
        run: python -m pip install --upgrade git+https://github.com/alliedmodders/ambuild.git

      - name: Clone build dependencies
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 --recurse-submodules --shallow-submodules -b ${{ matrix.mms.branch }} https://github.com/alliedmodders/metamod-source.git metamod-source
          mkdir -p dependencies
          git clone --mirror https://github.com/alliedmodders/hl2sdk.git hl2sdk-proxy-repo
          sdks=("episode1" "orangebox" "css" "hl2dm" "dods" "tf2" "l4d" "l4d2" "csgo" "nucleardawn" "insurgency" "sdk2013" "bms" "pvkii" "doi" "blade" "mcv")
          if [ '${{ matrix.target.os_name }}' = windows ]; then
            sdks+=("darkm" "swarm" "bgt" "contagion" "eye")
          fi
          for sdk in "${sdks[@]}" ; do
            git clone --depth 1 --recurse-submodules --shallow-submodules \
              -b "$sdk" hl2sdk-proxy-repo "dependencies/hl2sdk-$sdk"
          done

      - name: Build
        shell: bash
        run: |
          mkdir build && cd build
          if [ '${{ matrix.target.os_name }}' = windows ]; then
            py=python
          else
            py=python3
            export CC=clang-22 CXX=clang++-22
          fi
          $py ../configure.py \
            --hl2sdk-root ../dependencies \
            --hl2sdk-manifest-path ../hl2sdk-manifests \
            --mms-path ../metamod-source \
            --sdks=present \
            --targets ${{ matrix.target.arch }} \
            --enable-optimize
          ambuild

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-mms${{ matrix.mms.label }}-${{ matrix.target.os_name }}-${{ matrix.target.arch }}
          path: build/package/addons
          if-no-files-found: error

  # Merge the x86 and x86_64 slices into one package per MM:S branch and OS.
  # Runs on pull requests too, so the packages can be checked before a release.
  package:
    name: Package
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: pkg-*

      - name: Assemble packages
        shell: bash
        run: |
          version='${{ needs.version.outputs.version }}'

          mkdir -p dist
          for label in 1.12 2.0; do
            for os_name in windows linux; do
              package_dir="package-mms${label}-${os_name}"
              mkdir -p "${package_dir}/addons"
              for slice in artifacts/pkg-mms${label}-${os_name}-*/; do
                cp -a "${slice}." "${package_dir}/addons/"
                [ -d "${package_dir}/addons/stripper/dumps" ] || mkdir -p "${package_dir}/addons/stripper/dumps"
              done

              if [ "${os_name}" = windows ]; then
                asset="stripper-${version}-mms${label}-windows.zip"
                (cd "${package_dir}" && zip -r "../dist/${asset}" addons)
              else
                # fix permissions of the dlls first
                pushd "${package_dir}"/addons/stripper/bin
                chmod +x *.so
                pushd x64
                chmod +x *.so
                popd
                popd
                asset="stripper-${version}-mms${label}-linux.tar.gz"
                tar -czf "dist/${asset}" -C "${package_dir}" addons
              fi
            done
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error

  # A push to master publishes v<product.version>-git<N>; a pushed tag publishes
  # a release on that tag.
  release:
    name: Release
    needs: [version, package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [ '${{ github.ref_type }}' = tag ]; then
            tag='${{ github.ref_name }}'
            gh release create "${tag}" dist/* \
              --verify-tag \
              --title "Stripper ${tag}" \
              --notes "Automated release built from ${GITHUB_SHA}."
          else
            tag='v${{ needs.version.outputs.version }}'
            gh release create "${tag}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "Stripper ${{ needs.version.outputs.version }}" \
              --notes "Automated release built from ${GITHUB_SHA}."
          fi
